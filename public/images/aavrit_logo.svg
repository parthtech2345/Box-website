<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AAVRIT Packaging logo</title>
  <desc id="desc">A geometric dark hexagon with an orange letter A, separated from the AAVRIT Packaging wordmark. No tagline or orange dot beside the wordmark.</desc>
  <defs>
    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b34"/>
      <stop offset="0.52" stop-color="#243b49"/>
      <stop offset="1" stop-color="#101b22"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8a22"/>
      <stop offset="1" stop-color="#e95a0c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#050505"/>

  <!-- Faceted hexagonal emblem -->
  <path d="M190 36 L305 102 L305 235 L190 301 L75 235 L75 102 Z" fill="url(#hexFill)" stroke="#344b58" stroke-width="2"/>
  <path d="M190 36 L190 168 L75 102 Z" fill="#263d49" opacity=".72"/>
  <path d="M190 36 L305 102 L190 168 Z" fill="#314b59" opacity=".78"/>
  <path d="M75 102 L190 168 L75 235 Z" fill="#14242d" opacity=".55"/>
  <path d="M305 102 L190 168 L305 235 Z" fill="#172832" opacity=".55"/>
  <path d="M75 235 L190 168 L190 301 Z" fill="#1a2d37" opacity=".72"/>
  <path d="M305 235 L190 168 L190 301 Z" fill="#203641" opacity=".72"/>

  <!-- Stylized orange A -->
  <path d="M190 88 L270 232 L230 232 L190 158 L150 232 L110 232 Z" fill="url(#orange)"/>
  <path d="M171 199 L209 199 L221 220 L159 220 Z" fill="#f26b17"/>
  <path d="M190 252 L202 267 L190 282 L178 267 Z" fill="#f47719"/>

  <!-- Divider -->
  <rect x="365" y="55" width="3" height="225" fill="#e6e6e6"/>

  <!-- Wordmark: deliberately no orange dot after AAVRIT -->
  <text x="420" y="178" fill="#263b48" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="2">AAVRIT</text>
  <text x="425" y="235" fill="#e5e5e5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="17">PACKAGING</text>
</svg>
