<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .brand-title {
        font-family: 'Barlow Semi Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: 2.5px;
        fill: #202A2E;
      }
      .brand-sub {
        font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 7px;
        fill: #687378;
      }
      .brand-tag {
        font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 2px;
        fill: #D1B48C;
      }
    </style>
  </defs>

  <!-- Left: Custom Brand Icon Mark (Folded Corrugated Protective Enclosure 'A') -->
  <g transform="translate(15, 12)">
    <!-- Base outer protective shield / box wing (Industrial Charcoal) -->
    <path d="M 45 4 L 84 26 L 84 72 L 45 94 L 6 72 L 6 26 Z" fill="#202A2E" />
    
    <!-- Corrugated fold bevel line (Natural Kraft accent) -->
    <path d="M 45 4 L 45 94" stroke="#D1B48C" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Left faceted fold layer (Natural Kraft accent) -->
    <polygon points="45,4 84,26 45,50" fill="#2E3C42" />
    <polygon points="6,26 45,4 45,50" fill="#202A2E" />
    
    <!-- Inner architectural 'A' cross-fold (Packaging Orange) -->
    <polygon points="45,22 66,66 54,66 45,46 36,66 24,66" fill="#E97835" />
    
    <!-- Horizontal inner corrugated tie bar (Natural Kraft) -->
    <rect x="33" y="55" width="24" height="4.5" rx="1.5" fill="#D1B48C" />

    <!-- Protective interlocking bottom tab -->
    <polygon points="45,62 58,74 32,74" fill="#202A2E" />
    <circle cx="45" cy="83" r="3" fill="#E97835" />
  </g>

  <!-- Divider Line -->
  <line x1="124" y1="22" x2="124" y2="98" stroke="#E4DED3" stroke-width="1.5" />

  <!-- Right: Company Typography Wordmark -->
  <g transform="translate(144, 20)">
    <!-- Main Company Name: AAVRIT -->
    <text x="0" y="44" class="brand-title">AAVRIT</text>
    
    <!-- Packaging Orange decorative dot accent -->
    <circle cx="178" cy="30" r="5" fill="#E97835" />

    <!-- Subtitle: PACKAGING -->
    <text x="2" y="68" class="brand-sub">PACKAGING</text>

    <!-- Tagline: Protection in Every Layer. -->
    <text x="2" y="85" class="brand-tag">PROTECTION IN EVERY LAYER.</text>
  </g>
</svg>
