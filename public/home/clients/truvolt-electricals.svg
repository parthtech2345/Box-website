<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none" width="100%" height="100%">
  <!-- Emblem: TV Monogram with modern geometric electrical circuit bolt -->
  <g transform="translate(10, 6)">
    <circle cx="24" cy="24" r="22" fill="#EFF6FF" stroke="#1E40AF" stroke-width="2.5" />
    <!-- T top bar -->
    <path d="M12 15 L28 15" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round" />
    <!-- T stem converting into V and electric bolt -->
    <path d="M20 15 L20 25 L27 34 L36 15" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="25,22 22,27 25,27 23,33 28,26 25,26" fill="#F59E0B" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(68, 16)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="0.5">TRUVOLT</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#2563EB" letter-spacing="2">ELECTRICALS</text>
  </g>
</svg>
