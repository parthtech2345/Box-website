<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" width="100%" height="100%">
  <!-- Emblem: MF Lettermark with subtle natural leaf curvature -->
  <g transform="translate(10, 6)">
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#EBF4EE" stroke="#2D6A4F" stroke-width="2.5" />
    <!-- M letterform -->
    <path d="M12 34 L12 16 L18 25 L24 16 L24 34" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- F letter with leaf terminal -->
    <path d="M28 34 L28 16 L38 16" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 24 L35 24" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" />
    <!-- Subtle organic leaf arc -->
    <path d="M38 16 C38 16 39 10 33 11 C28 12 30 16 38 16 Z" fill="#52B788" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(68, 16)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#1B4332" letter-spacing="1">MIVORA</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#52B788" letter-spacing="3">FOODS</text>
  </g>
</svg>
