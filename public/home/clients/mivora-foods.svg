<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="mivora-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mivora-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Emblem: Fresh Organic Leaf Capsule -->
  <g transform="translate(6, 6)">
    <!-- Shield / Capsule Container -->
    <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#mivora-green)" />
    <!-- Leaf Overlap Curves -->
    <path d="M12 28 C12 18, 22 14, 34 14 C34 26, 26 34, 12 28 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M18 34 C24 34, 32 30, 36 22 C34 32, 26 36, 18 34 Z" fill="url(#mivora-sun)" />
    <!-- Organic Stem Rib -->
    <path d="M16 28 Q24 23 32 16" stroke="#047857" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(64, 15)">
    <text x="0" y="17" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#064E3B" letter-spacing="1.5">MIVORA</text>
    <text x="0" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#059669" letter-spacing="3.5">FOODS</text>
  </g>
</svg>
