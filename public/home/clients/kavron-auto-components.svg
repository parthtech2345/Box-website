<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="kavron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25822" />
      <stop offset="100%" stop-color="#A63A12" />
    </linearGradient>
    <linearGradient id="kavron-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Emblem: Precision Machined Hexagonal Monogram -->
  <g transform="translate(6, 6)">
    <!-- Base Hexagon -->
    <polygon points="24,3 44,14 44,34 24,45 4,34 4,14" fill="url(#kavron-dark)" />
    <!-- Dynamic K Wings -->
    <path d="M15 13 L15 35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <path d="M16 24 L28 13" stroke="url(#kavron-grad)" stroke-width="4" stroke-linecap="round" />
    <path d="M21 19 L30 35" stroke="url(#kavron-grad)" stroke-width="4" stroke-linecap="round" />
    <!-- Center Precision Gear Dot -->
    <circle cx="24" cy="24" r="3" fill="#FFFFFF" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(64, 15)">
    <text x="0" y="17" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="1">KAVRON</text>
    <text x="0" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#E25822" letter-spacing="2">AUTO COMPONENTS</text>
  </g>
</svg>
