<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" fill="none" width="100%" height="100%">
  <!-- Emblem: NT Lettermark with woven-fabric geometric lattice -->
  <g transform="translate(10, 6)">
    <rect x="2" y="2" width="44" height="44" rx="8" fill="#FDF4F5" stroke="#701A75" stroke-width="2.5" />
    <!-- Woven fabric warp and weft lines forming NT -->
    <path d="M12 34 L12 15 L22 34 L22 15" stroke="#701A75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M26 15 L38 15" stroke="#A21CAF" stroke-width="3.5" stroke-linecap="round" />
    <path d="M32 15 L32 34" stroke="#A21CAF" stroke-width="3" stroke-linecap="round" />
    <!-- Weaving stitch accents -->
    <line x1="8" y1="24" x2="40" y2="24" stroke="#D946EF" stroke-width="1.5" stroke-dasharray="2,3" />
  </g>
  
  <!-- Text Label -->
  <g transform="translate(68, 16)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#2E1065" letter-spacing="1">NIVAAN</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9333EA" letter-spacing="2.5">TEXTILES</text>
  </g>
</svg>
