<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Favicon / App Icon: Interlocking Corrugated Shield 'A' -->
  <rect width="100" height="100" rx="20" fill="#202A2E" />
  
  <g transform="translate(5, 3)">
    <!-- Base outer protective hexagon / box wing -->
    <path d="M 45 6 L 82 27 L 82 67 L 45 88 L 8 67 L 8 27 Z" fill="#2E3C42" stroke="#D1B48C" stroke-width="1.5" />
    
    <!-- Corrugated fold bevel line -->
    <path d="M 45 6 L 45 88" stroke="#D1B48C" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Faceted fold -->
    <polygon points="45,6 82,27 45,48" fill="#3A4A52" />
    <polygon points="8,27 45,6 45,48" fill="#202A2E" />
    
    <!-- Inner architectural 'A' cross-fold -->
    <polygon points="45,22 66,66 54,66 45,46 36,66 24,66" fill="#E97835" />
    
    <!-- Tie bar -->
    <rect x="33" y="55" width="24" height="4.5" rx="1.5" fill="#D1B48C" />
    <circle cx="45" cy="78" r="3.5" fill="#E97835" />
  </g>
</svg>
